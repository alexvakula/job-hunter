[project]
name = "jobhunter"
version = "0.1.0"
description = "Family job-search tracker (jobs.example.org)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "tzdata>=2024.1",
    "nh3>=0.3.7",
    "defusedxml>=0.7.1",
    "python-docx>=1.2.0",
    "pypdf>=6.19.0",
    "fpdf2>=2.8.9",
    "jsonschema>=4.26.0",
    "maxminddb>=2.6",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/jobhunter/static/vendor", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running performance tests"]
