{% extends "base.html" %}
{% block title %}New account{% endblock %}
{% block content %}
<h1>New account</h1>
{% include "admin/_nav.html" %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/admin/users/new" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Username (lower-case letters and digits) <input name="username" value="{{ form.get('username', '') }}" pattern="[a-z0-9]{2,32}" required autocomplete="off"></label>
  <label>Display name <input name="display_name" value="{{ form.get('display_name', '') }}" maxlength="80" required></label>
  <label>Temporary password (at least 12 characters) <input type="text" name="temp_password" minlength="12" required autocomplete="off"></label>
  <p class="muted">They'll be asked to choose their own password the first time they log in.</p>
  <button type="submit" class="btn">Create account</button> <a href="/admin/users" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
