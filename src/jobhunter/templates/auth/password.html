{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  {% if forced %}<p class="warn">Please choose your own password before continuing.</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password (at least 12 characters) <input type="password" name="new" autocomplete="new-password" minlength="12" required></label>
    <label>Repeat new password <input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
    <button type="submit" class="btn">Change password</button>
  </form>
</section>
{% endblock %}
